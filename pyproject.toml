[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asds-omega"
version = "2.0.0"
description = "ASDS-OMEGA v2.0: Variational Equivariant Causal-Symbolic Discovery (VECSD) for Autonomous Scientific Law Discovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Mahmoud Muhammad Elsayed" }
]
keywords = [
    "symbolic-regression",
    "weak-form",
    "causal-discovery",
    "lie-symmetries",
    "conservation-laws",
    "autonomous-scientist",
    "scientific-machine-learning",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "sympy>=1.12",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
benchmarks = [
    "pysindy>=2.0",
]
gui = [
    "pywebview>=5.0",
]

[project.urls]
Homepage = "https://mohai1922.github.io/ASDS/"
Repository = "https://github.com/MohAI1922/ASDS"
Issues = "https://github.com/MohAI1922/ASDS/issues"

[project.scripts]
asds-omega = "asds_omega.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["asds_omega"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
