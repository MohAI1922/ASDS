name: Build JOSS Paper Draft (Inara)

on:
  push:
    branches: [ main ]
    paths:
      - 'paper.md'
      - 'paper.bib'
      - 'results/figures/**'
      - '.github/workflows/joss-paper.yml'
  pull_request:
    paths:
      - 'paper.md'
      - 'paper.bib'
  workflow_dispatch:

jobs:
  compile-joss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile JOSS paper.md with official openjournals/inara Docker image
        run: |
          docker run --rm \
            --volume "$PWD:/data" \
            --user "$(id -u):$(id -g)" \
            --env JOURNAL=joss \
            openjournals/inara:latest -o pdf paper.md
          ls -lh paper.pdf
      - name: Upload compiled JOSS paper.pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-pdf
          path: paper.pdf
